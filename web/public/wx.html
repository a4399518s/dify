<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscribe Page</title>
    <script src="//res.wx.qq.com/open/js/jweixin-1.6.0.js"></script>
    <script>
        alert("开始")
        function fetchData() {
            fetch('/console/api/channel/wx/config?url='+location.href)
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok ' + response.statusText);
                }
                return response.json();
            })
            .then(data => {
              debugger
              wx.ready(function () {
                console.log("wx ready")
                alert("成功")
              });
              wx.error(function (res) {
                alert("错误")
              })
              wx.config(data.data);
            }).catch(error => {
              console.error('There was a problem with the fetch operation:', error);
            });
        }

        fetchData();

    </script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <h1>Subscribe to Video Notifications</h1>
    <wx-open-subscribe template="daRbCWvn3k2LDdWP6Atfm7CGYGuB-Zo87s6Ng2HrszM" id="subscribe-btn">
      <script type="text/wxtag-template" slot="style">
        <style>
          .subscribe-btn {
            color: #fff;
            background-color: #07c160;
          }
        </style>
      </script>
      <script type="text/wxtag-template">
        <button class="subscribe-btn">
          订阅视频通知              
        </button>
      </script>
    </wx-open-subscribe>
    <script>
      var btn = document.getElementById('subscribe-btn');
      btn.addEventListener('success', function (e) {            
        console.log('success', e.detail);
      });   
      btn.addEventListener('error',function (e) {             
        console.log('fail', e.detail);
      });
    </script>
</body>
</html>
